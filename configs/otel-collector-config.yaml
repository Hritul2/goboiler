receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: detailed
  file/traces:
    path: /logs/traces.jsonl
    rotation:
      max_megabytes: 10
      max_days: 7
      max_backups: 3
  file/metrics:
    path: /logs/metrics.jsonl
    rotation:
      max_megabytes: 10
      max_days: 7
      max_backups: 3
  file/logs:
    path: /logs/otel-logs.jsonl
    rotation:
      max_megabytes: 10
      max_days: 7
      max_backups: 3

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/traces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/logs]
