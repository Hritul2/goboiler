# Boilerplate-only: `make init` deletes this file in generated projects.
name: Boilerplate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: boilerplate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"

jobs:
  # make init on a scratch copy; Linux has GNU sed, macOS has BSD sed. The
  # KEEP_EXAMPLES=1 variant (Linux only) keeps examples/ and runs make check on it
  # under the new module path; the others assert examples/ is removed.
  init-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            keep_examples: ""
          - os: macos-latest
            keep_examples: ""
          - os: ubuntu-latest
            keep_examples: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.0
          install-only: true
      - run: make init-smoke
        env:
          KEEP_EXAMPLES: ${{ matrix.keep_examples }}
